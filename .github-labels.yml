# Centralized label manifest for all consumer repos.
# Sync via the `sync-labels` reusable workflow.

# --- PR size labels (pascalgn/size-label-action) ---
- name: "size/XS"
  color: "3cbf00"
  description: "0–9 changed lines"

- name: "size/S"
  color: "5d9801"
  description: "10–29 changed lines"

- name: "size/M"
  color: "7f7203"
  description: "30–99 changed lines"

- name: "size/L"
  color: "a14c05"
  description: "100–499 changed lines"

- name: "size/XL"
  color: "c32607"
  description: "500–999 changed lines"

- name: "size/XXL"
  color: "e50009"
  description: "1000+ changed lines"

# --- Path-based labels (actions/labeler, see path-labels.yml) ---
- name: "docs"
  color: "0075ca"
  description: "Documentation changes"

- name: "ci"
  color: "fbca04"
  description: "CI/CD and workflow changes"

- name: "github-config"
  color: "bfd4f2"
  description: "Repository configuration and community health files"

- name: "tests"
  color: "c5def5"
  description: "Test changes"

- name: "frontend"
  color: "d4c5f9"
  description: "UI, components, and styling changes"

- name: "backend"
  color: "5319e7"
  description: "Server-side and application logic changes"

- name: "shell"
  color: "006b75"
  description: "Shell scripts and dotfile changes"

- name: "notebooks"
  color: "f9d0c4"
  description: "Jupyter notebook changes"
